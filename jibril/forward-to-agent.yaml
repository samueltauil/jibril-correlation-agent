#
# Forward security events to the Jibril Correlation Agent.
# Place in /etc/jibril/alchemies/private/
#
# Uses built-in kind names with unique names and shell reactions
# to forward detected events to the agent.
#

# Credential file access → forward to agent.

- kind: credentials_files_access
  name: agent_forward_credentials
  enabled: true
  version: 1.0
  description: Forward credential file access to correlation agent
  breed: file_access
  mechanism: file_access
  tactic: credential_access
  technique: unsecured_credentials
  subtechnique: none
  importance: critical
  severity_level: critical
  severity: 80
  confidence: 0.5
  times:
    - kind: times_per_proc
      max: 2
    - kind: times_per_exe
      max: 4
    - kind: times_per_full_ancestry
      max: 4
  arbitrary: []
  file_actions:
    - read
    - access_related
  file_actions_how: any
  bases:
    - dir: /etc
      base: shadow
    - dir: /etc
      base: gshadow
    - dir: /etc
      base: passwd
  reactions:
    - format: shell
      code: |
        curl -sf -X POST -H "Content-Type: application/json" -d "$REACTION_DATA" http://localhost:3000/events || true

